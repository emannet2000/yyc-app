# YYC Brokers - Render Blueprint
# Infrastructure as Code for Render deployment
# Deploy with: render blueprint apply

services:
  # Main web service (Node.js API + frontend)
  - type: web
    name: yyc-brokers
    runtime: docker
    repo: https://github.com/emannet2000/yyc-app
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Deploys are triggered by GitHub Actions only after tests pass (.github/workflows/ci.yml).
    autoDeploy: false

    # Instance configuration
    plan: starter # Options: starter ($7), standard ($25), pro ($85)

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: 3000

      # Database connection (auto-generated by Render)
      - key: DATABASE_URL
        fromDatabase:
          name: yyc-postgres
          property: connectionString

      # Redis connection (auto-generated by Render)
      - key: REDIS_URL
        fromService:
          type: redis
          name: yyc-redis
          property: connectionString

      # Public origin for CORS/CSRF (set after first deploy)
      - key: PUBLIC_ORIGIN
        value: https://yyc-brokers.onrender.com # UPDATE after first deploy

      # Third-party API keys (set these in Render dashboard for security)
      # - key: RESEND_API_KEY
      #   sync: false
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: STRIPE_WEBHOOK_SECRET
      #   sync: false
      # - key: GOOGLE_MAPS_API_KEY
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: AWS_S3_BUCKET
      #   sync: false
      # - key: SENTRY_DSN
      #   sync: false

databases:
  # PostgreSQL database
  - name: yyc-postgres
    databaseName: yyc
    plan: starter # Options: starter ($7), standard ($20)
    postgresMajorVersion: 16
    # Automatic daily backups included

# Redis instance
# Note: Redis is defined as a "service" in Render, not under "databases"
# You need to create this manually in the Render dashboard or via API
# Service type: Redis
# Name: yyc-redis
# Plan: starter ($10/month)
