name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yyc_test
          POSTGRES_PASSWORD: yyc_test
          POSTGRES_DB: yyc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yyc_test -d yyc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      NODE_ENV: test
      # Enables the PostgreSQL + Redis integration test in test/app.test.js
      YYC_INTEGRATION_DATABASE_URL: postgresql://yyc_test:yyc_test@localhost:5432/yyc_test
      YYC_INTEGRATION_REDIS_URL: redis://localhost:6379
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Syntax check server code
        run: npm run check

      - name: Build frontend
        run: npm run client:build

      - name: Frontend unit tests (Vitest)
        run: npm run test:unit

      - name: Backend tests incl. PostgreSQL/Redis integration (node --test)
        run: npm run test:node

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yyc-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set - skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered for ${GITHUB_SHA::7}"
